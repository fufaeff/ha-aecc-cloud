set_working_mode:
  name: Set Working Mode
  description: Set inverter Output Priority (SBU/PBG, SUB/PGB, USB/GPB, MKS) via AEC Cloud.
  fields:
    mode:
      name: Mode
      description: The priority mode to set for the inverter and battery.
      required: true
      example: "SBU (Solar -> Battery -> Utility)"
      selector:
        select:
          options:
            - "SBU (Solar -> Battery -> Utility)"
            - "SUB (Solar -> Utility -> Battery)"
            - "USB (Utility -> Solar -> Battery)"
            - "MKS (Generator first)"
    device_sn:
      name: Device Serial Number
      description: Optional inverter serial number. If omitted, master/solar inverter SN will be auto-detected.
      required: false
      example: "SN12345678"
      selector:
        text:

