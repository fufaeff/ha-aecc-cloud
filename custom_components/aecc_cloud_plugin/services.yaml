set_energy_counter:
  name: Set Energy Counter
  description: >-
    Set a calculated energy sensor (Total Load / Solar / Battery Charge / Battery Discharge Energy)
    to a given value in kWh, e.g. 0 to reset or the inverter's own lifetime counter to align.
  target:
    entity:
      integration: aecc_cloud_plugin
      domain: sensor
      device_class: energy
  fields:
    value:
      name: Value
      description: New counter value in kWh.
      required: false
      default: 0
      example: 71.63
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.001
          unit_of_measurement: kWh
          mode: box
